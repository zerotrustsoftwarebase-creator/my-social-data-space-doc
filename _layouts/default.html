<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — My (Social) Data Space</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#080A0F">
<link rel="icon" href="{{ '/assets/store-icon-512.png' | relative_url }}" type="image/png">
<meta property="og:type" content="article">
<meta property="og:site_name" content="My (Social) Data Space">
<meta property="og:title" content="{{ page.title }} — My (Social) Data Space">
<meta property="og:image" content="{{ '/assets/og-1200x630.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap">
<style>
  :root {
    --ground:#080A0F; --surface:#10131A; --raised:#171B24; --line:#303746;
    --ink:#F7F8FC; --ink-2:#B1B8C8; --brand:#8B7CFF; --brand-bright:#A99FFF; --mint:#45D69A; --on-light:#11131A;
    --font-head:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-body); font-size:1.0625rem; line-height:1.7; -webkit-font-smoothing:antialiased; }
  a { color:var(--brand-bright); text-underline-offset:.15em; overflow-wrap:anywhere; }
  a:hover { color:var(--ink); }
  :focus-visible { outline:3px solid var(--mint); outline-offset:3px; border-radius:4px; }
  .skip { position:absolute; left:1rem; top:-4rem; background:var(--mint); color:var(--on-light); padding:.6rem 1rem; border-radius:8px; font-weight:600; z-index:10; text-decoration:none; }
  .skip:focus { top:1rem; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 1.25rem; }
  .site-header { border-bottom:1px solid var(--line); background:rgba(8,10,15,.85); backdrop-filter:blur(8px); position:sticky; top:0; z-index:5; }
  .site-header .wrap { display:flex; align-items:center; justify-content:space-between; gap:1rem; min-height:4rem; }
  .brand { display:flex; align-items:center; gap:.7rem; color:var(--ink); text-decoration:none; font-family:var(--font-head); font-weight:700; }
  .brand img { width:2.25rem; height:2.25rem; border-radius:9px; display:block; }
  .brand span span { color:var(--brand-bright); }
  nav ul { list-style:none; margin:0; padding:0; display:flex; gap:.25rem; }
  nav a { display:inline-block; padding:.6rem .8rem; color:var(--ink-2); text-decoration:none; font-weight:600; border-radius:8px; }
  nav a:hover { color:var(--ink); background:var(--raised); }
  main { padding:clamp(2rem,5vw,4rem) 0 clamp(3rem,6vw,5rem); }
  .prose { max-width:72ch; }
  .prose h1, .prose h2, .prose h3 { font-family:var(--font-head); line-height:1.15; letter-spacing:-.015em; text-wrap:balance; scroll-margin-top:5rem; }
  .prose h1 { font-weight:800; font-size:clamp(2rem,4.5vw,3rem); margin:0 0 .5rem; }
  .prose h1 + p strong { color:var(--ink-2); font-weight:600; }
  .prose h2 { font-weight:800; font-size:clamp(1.5rem,3vw,2rem); margin:2.5rem 0 .75rem; }
  .prose h3 { font-weight:700; font-size:1.35rem; margin:2.25rem 0 .6rem; padding-top:1.5rem; border-top:1px solid var(--line); }
  .prose p, .prose li { color:var(--ink-2); }
  .prose strong { color:var(--ink); }
  .prose code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em; background:var(--raised); padding:.1em .4em; border-radius:5px; color:var(--ink); }
  .prose ul { padding-left:1.25rem; }
  .prose li + li { margin-top:.4rem; }
  .prose table { border-collapse:collapse; width:100%; margin:1rem 0 1.5rem; font-size:.97rem; display:block; overflow-x:auto; }
  .prose th, .prose td { text-align:left; vertical-align:top; padding:.65rem .8rem; border-bottom:1px solid var(--line); }
  .prose th { color:var(--ink); font-family:var(--font-head); font-weight:700; font-size:.85rem; letter-spacing:.06em; text-transform:uppercase; }
  .prose td { color:var(--ink-2); }
  .prose hr { border:0; border-top:1px solid var(--line); margin:2rem 0; }
  footer { border-top:1px solid var(--line); padding:2rem 0 3rem; color:var(--ink-2); font-size:.95rem; }
  footer ul { list-style:none; margin:0 0 1rem; padding:0; display:flex; flex-wrap:wrap; gap:.25rem 1.25rem; }
  @media (max-width:520px) { nav a { padding:.55rem .6rem; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="My (Social) Data Space — home">
      <img src="{{ '/assets/store-icon-512.png' | relative_url }}" alt="" width="36" height="36">
      <span>My (Social) <span>Data Space</span></span>
    </a>
    <nav aria-label="Site">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/privacy/' | relative_url }}">Privacy policy</a></li>
        <li><a href="https://github.com/zerotrustsoftwarebase-creator/my-social-data-space-doc/issues">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main">
  <div class="wrap">
    <article class="prose">
      {{ content }}
    </article>
  </div>
</main>
<footer>
  <div class="wrap">
    <ul aria-label="Footer">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/privacy/' | relative_url }}">Privacy policy</a></li>
      <li><a href="{{ '/privacy/#7-deleting-your-data' | relative_url }}">Deleting your data</a></li>
      <li><a href="https://github.com/zerotrustsoftwarebase-creator/my-social-data-space-doc/issues">Contact</a></li>
    </ul>
    <small>© 2026 My (Social) Data Space.</small>
  </div>
</footer>
</body>
</html>
